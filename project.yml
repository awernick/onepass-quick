name: OnePassQuick
options:
  bundleIdPrefix: com.awernick
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  OnePassQuick:
    type: application
    platform: macOS
    sources:
      - path: OnePassQuick
        excludes:
          - Resources/Info.plist
    info:
      path: OnePassQuick/Resources/Info.plist
      properties:
        CFBundleDisplayName: OnePass Quick
        CFBundleName: OnePassQuick
        CFBundleIdentifier: com.awernick.OnePassQuick
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.2.0"
        LSUIElement: true
        NSHighResolutionCapable: true
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.awernick.OnePassQuick
        PRODUCT_NAME: OnePassQuick
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: OnePassQuick/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # Note: The built binary is ad-hoc signed. Run the post-build
        # re-sign step (see AGENTS.md build instructions) to get a stable
        # signature for Accessibility permissions.
        ENABLE_HARDENED_RUNTIME: true
